<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NextStep</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b6cb0">
<link rel="icon" href="icon-192.png">
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fa;color:#1a202c}
#app{max-width:560px;margin:0 auto;padding:20px}
h1{color:#2b6cb0;margin:8px 0}
select{padding:8px;font-size:16px;border-radius:8px;margin-bottom:8px}
input{width:100%;box-sizing:border-box;padding:14px;font-size:18px;border:2px solid #cbd5e0;border-radius:10px}
button{display:block;width:100%;margin:10px 0;padding:14px;font-size:18px;border:0;border-radius:10px;background:#2b6cb0;color:#fff;cursor:pointer}
button.alt{background:#fff;color:#2b6cb0;border:2px solid #2b6cb0}
.step{font-size:20px;line-height:1.45;margin:12px 0}
.text{font-size:24px;line-height:1.4;white-space:pre-line;margin:20px 0}
</style></head>
<body><div id="app"></div>
<script src="app.js"></script></body></html>
